<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BỆNH VIỆN QUÂN Y 105</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg border border-gray-200 flex flex-col overflow-hidden">
        
        <header class="bg-blue-600 text-white p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-white text-blue-600 p-2 rounded-lg font-bold text-xl shadow-sm">💡</div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide uppercase">BỆNH VIỆN QUÂN Y 105</h1>
                    <p class="text-xs text-blue-100">KHOA TÂM THẦN KINH - Sức Khỏe Tâm Thần</p>
                </div>
            </div>
            <button id="btnPrint" onclick="window.print()" class="bg-black/30 hover:bg-black/50 text-white text-xs font-semibold py-1.5 px-3 rounded opacity-50 cursor-not-allowed" disabled>
                IN KẾT QUẢ (PDF)
            </button>
        </header>

        <form id="psychologyForm" class="p-6 flex-1 flex flex-col gap-6">
            
            <div id="step1" class="step active flex flex-col gap-4">
                <div class="border-l-4 border-blue-600 pl-2 mb-2">
                    <h2 class="text-blue-800 font-bold uppercase text-sm tracking-wider">Hành chính bệnh nhân</h2>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Mã số BN</label>
                    <input type="text" id="patientId" value="BN001" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Họ và tên</label>
                    <input type="text" id="patientName" value="Nguyễn Văn A" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-blue-500" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Tuổi</label>
                        <input type="number" id="patientAge" value="67" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Giới tính</label>
                        <select id="patientGender" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-blue-500">
                            <option value="Nam" selected>Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="step2" class="step flex flex-col gap-4">
                <div class="flex bg-gray-200 p-1 rounded-lg text-xs font-semibold text-gray-600 mb-2">
                    <button type="button" class="flex-1 py-1.5 text-center bg-white rounded shadow text-blue-600">THANG BECK</button>
                    <button type="button" class="flex-1 py-1.5 text-center cursor-not-allowed" disabled>THANG HAMILTON</button>
                    <button type="button" class="flex-1 py-1.5 text-center cursor-not-allowed" disabled>THANG ZUNG</button>
                </div>

                <div class="border-l-4 border-blue-600 pl-2">
                    <h2 class="text-blue-800 font-bold uppercase text-sm tracking-wider">1. Nỗi buồn</h2>
                </div>

                <div class="flex flex-col gap-2 mt-2">
                    <label class="flex items-center justify-between p-3 border border-gray-200 rounded-lg text-sm cursor-pointer hover:bg-gray-50 transition">
                        <span class="text-gray-700">Tôi không cảm thấy buồn.</span>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="q1" value="0" class="w-4 h-4 text-blue-600">
                            <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-xs border border-gray-300">0 đ</span>
                        </div>
                    </label>

                    <label class="flex items-center justify-between p-3 border border-blue-500 bg-blue-50/50 rounded-lg text-sm cursor-pointer transition">
                        <span class="text-gray-900 font-medium">Nhiều lúc tôi cảm thấy buồn buồn.</span>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="q1" value="1" checked class="w-4 h-4 text-blue-600">
                            <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-xs border border-blue-300 font-bold">1 đ</span>
                        </div>
                    </label>

                    <label class="flex items-center justify-between p-3 border border-gray-200 rounded-lg text-sm cursor-pointer hover:bg-gray-50 transition">
                        <span class="text-gray-700">Lúc nào tôi cũng buồn và không thể nguôi được.</span>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="q1" value="2" class="w-4 h-4 text-blue-600">
                            <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-xs border border-gray-300">2 đ</span>
                        </div>
                    </label>

                    <label class="flex items-center justify-between p-3 border border-gray-200 rounded-lg text-sm cursor-pointer hover:bg-gray-50 transition">
                        <span class="text-gray-700">Tôi quá buồn hoặc tuyệt vọng đến mức đau khổ.</span>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="q1" value="3" class="w-4 h-4 text-blue-600">
                            <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-xs border border-gray-300">3 đ</span>
                        </div>
                    </label>
                </div>
            </div>

            <div id="step3" class="step flex flex-col gap-4">
                <div class="border-l-4 border-blue-600 pl-2 mb-2">
                    <h2 class="text-blue-800 font-bold uppercase text-sm tracking-wider">Kết luận lâm sàng</h2>
                </div>

                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-xs text-gray-600 space-y-1 mb-2">
                    <p><strong>Bệnh nhân:</strong> <span id="resName"></span> (<span id="resGender"></span>) - <span id="resAge"></span> tuổi</p>
                    <p><strong>Mã số:</strong> <span id="resId"></span></p>
                </div>

                <div class="bg-green-50 border border-green-200 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Thang điểm BECK:</span>
                        <span class="text-lg font-bold text-green-700">3 đ</span>
                    </div>
                    <span class="bg-green-200 text-green-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">Bình thường</span>
                </div>

                <div class="bg-green-50 border border-green-200 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Thang điểm HAMILTON:</span>
                        <span class="text-lg font-bold text-green-700">2 đ</span>
                    </div>
                    <span class="bg-green-200 text-green-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">Bình thường</span>
                </div>

                <div class="bg-green-50 border border-green-200 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Thang điểm ZUNG:</span>
                        <span class="text-lg font-bold text-green-700">7 đ</span>
                    </div>
                    <span class="bg-green-200 text-green-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">Bình thường</span>
                </div>
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-gray-100 mt-auto">
                <button type="button" id="btnPrev" onclick="changeStep(-1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold text-sm py-2 px-5 rounded-xl transition invisible">
                    Quay lại
                </button>
                <button type="button" id="btnNext" onclick="changeStep(1)" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm py-2 px-5 rounded-xl transition shadow-md shadow-blue-200">
                    Tiếp theo
                </button>
            </div>

        </form>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        function changeStep(stepOffset) {
            // Kiểm tra validate đơn giản ở bước 1 trước khi qua bước 2
            if (currentStep === 1 && stepOffset === 1) {
                if (!document.getElementById('patientName').value || !document.getElementById('patientAge').value) {
                    alert('Vui lòng điền đầy đủ họ tên và tuổi bệnh nhân.');
                    return;
                }
            }

            // Ẩn trang hiện tại
            document.getElementById(`step${currentStep}`).classList.remove('active');
            
            // Cập nhật vị trí trang mới
            currentStep += stepOffset;
            
            // Hiển thị trang mới
            document.getElementById(`step${currentStep}`).classList.add('active');

            // Đồng bộ dữ liệu hành chính sang trang kết quả trước khi hiển thị
            if (currentStep === 3) {
                document.getElementById('resId').innerText = document.getElementById('patientId').value;
                document.getElementById('resName').innerText = document.getElementById('patientName').value;
                document.getElementById('resAge').innerText = document.getElementById('patientAge').value;
                document.getElementById('resGender').innerText = document.getElementById('patientGender').value;
            }

            // Cập nhật trạng thái các nút Điều hướng & nút In
            updateNavigation();
        }

        function updateNavigation() {
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnPrint = document.getElementById('btnPrint');

            // Ẩn/Hiện nút Quay lại
            if (currentStep === 1) {
                btnPrev.classList.add('invisible');
            } else {
                btnPrev.classList.remove('invisible');
            }

            // Đổi text nút "Tiếp theo" thành "Xem kết quả" hoặc ẩn đi ở trang cuối
            if (currentStep === totalSteps) {
                btnNext.innerText = "Hoàn tất";
                btnNext.classList.add('bg-green-600', 'hover:bg-green-700');
                btnNext.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                
                // Kích hoạt nút In PDF ở header
                btnPrint.removeAttribute('disabled');
                btnPrint.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnNext.innerText = "Tiếp theo";
                btnNext.classList.remove('bg-green-600', 'hover:bg-green-700');
                btnNext.classList.add('bg-blue-600', 'hover:bg-blue-700');

                // Vô hiệu hóa nút In PDF nếu không phải trang cuối
                btnPrint.setAttribute('disabled', 'true');
                btnPrint.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
