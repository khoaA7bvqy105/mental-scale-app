<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoa Thần Kinh - Tâm Thần | 3 Thang Đo Lâm Sàng</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            body { background: white; color: black; font-size: 12pt; }
            .no-print { display: none !important; }
            .print-border-none { border: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm no-print">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-600 rounded-xl text-white shadow-md">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-900 uppercase tracking-tight">BỆNH VIỆN ĐA KHOA 105</h1>
                    <p class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Khoa Thần Kinh - Tâm Thần (A7)</p>
                </div>
            </div>
            <div class="flex gap-2 w-full sm:w-auto justify-end">
                <button onclick="window.print()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all shadow-sm cursor-pointer">
                    In Kết Quả (PDF)
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm print-border-none">
                <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wide mb-4 flex items-center gap-2 pb-2 border-b border-slate-100">
                    <span class="w-1.5 h-4 bg-blue-600 rounded-full"></span> Hành chính bệnh nhân
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase">Mã số BN</label>
                        <input type="text" id="p-id" placeholder="Ví dụ: BN1024" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase">Họ và Tên</label>
                        <input type="text" id="p-name" placeholder="Nguyễn Văn A" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase">Tuổi</label>
                            <input type="number" id="p-age" placeholder="35" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase">Giới tính</label>
                            <select id="p-gender" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option>Nam</option>
                                <option>Nữ</option>
                                <option>Khác</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm print-border-none">
                <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wide mb-4 flex items-center gap-2 pb-2 border-b border-slate-100">
                    <span class="w-1.5 h-4 bg-blue-600 rounded-full"></span> Kết Luận Lâm Sàng
                </h2>
                <div class="space-y-4">
                    <div class="p-3 border rounded-lg border-slate-100">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-semibold text-xs sm:text-sm">Thang điểm BECK:</span>
                            <span id="beck-score" class="font-mono font-bold text-base text-blue-600">0 đ</span>
                        </div>
                        <div id="beck-eval" class="text-xs px-2 py-1 rounded-md border font-medium text-green-600 bg-green-50 border-green-200">Bình thường</div>
                    </div>
                    <div class="p-3 border rounded-lg border-slate-100">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-semibold text-xs sm:text-sm">Thang điểm HAMILTON:</span>
                            <span id="hamilton-score" class="font-mono font-bold text-base text-blue-600">0 đ</span>
                        </div>
                        <div id="hamilton-eval" class="text-xs px-2 py-1 rounded-md border font-medium text-green-600 bg-green-50 border-green-200">Bình thường</div>
                    </div>
                    <div class="p-3 border rounded-lg border-slate-100">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-semibold text-xs sm:text-sm">Thang điểm ZUNG:</span>
                            <span id="zung-score" class="font-mono font-bold text-base text-blue-600">0 đ</span>
                        </div>
                        <div id="zung-eval" class="text-xs px-2 py-1 rounded-md border font-medium text-green-600 bg-green-50 border-green-200">Bình thường</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 no-print">
            <div class="flex bg-slate-200 p-1 rounded-xl mb-4 gap-1">
                <button onclick="switchTab('beck')" id="btn-beck" class="flex-1 text-center py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm cursor-pointer">Thang Beck</button>
                <button onclick="switchTab('hamilton')" id="btn-hamilton" class="flex-1 text-center py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all text-slate-600 hover:text-slate-950 cursor-pointer">Thang Hamilton</button>
                <button onclick="switchTab('zung')" id="btn-zung" class="flex-1 text-center py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all text-slate-600 hover:text-slate-950 cursor-pointer">Thang Zung</button>
            </div>

            <div id="questions-wrapper" class="space-y-4"></div>
        </div>
    </main>

    <script>
        const BECK_QS = [
            { id: 1, text: "Nỗi buồn", opts: ["Tôi không cảm thấy buồn.", "Nhiều lúc tôi cảm thấy buồn buồn.", "Lúc nào tôi cũng buồn và không thể nguôi được.", "Tôi quá buồn hoặc tuyệt vọng đến mức đau khổ."] },
            { id: 2, text: "Bi quan", opts: ["Tôi không nản lòng về tương lai.", "Tôi cảm thấy nản lòng về tương lai hơn trước.", "Tôi cảm thấy chẳng có gì để mong đợi ở tương lai cả.", "Tôi cảm thấy tương lai hoàn toàn tuyệt vọng và mọi thứ tồi tệ hơn."] },
            { id: 3, text: "Sự thất bại", opts: ["Tôi không cảm thấy như một người thất bại.", "Tôi cảm thấy mình đã thất bại hơn một người bình thường.", "Nhìn lại cuộc đời, tôi thấy mình có quá nhiều thất bại.", "Tôi cảm thấy mình là một người thất bại hoàn toàn."] }
        ];

        const HAMILTON_QS = [
            { id: 1, text: "Tâm trạng trầm cảm", opts: ["Không có", "Nghi ngờ hoặc thoáng qua", "Rõ ràng nhưng thay đổi được", "Thường xuyên, ảnh hưởng chức năng", "Liên tục, mất chức năng hoàn toàn"] },
            { id: 2, text: "Cảm giác có tội", opts: ["Không có", "Tự trách mình, thấy làm khổ người khác", "Ý tưởng bị tội hoặc suy diễn tội lỗi", "Bệnh nhân cho rằng mình bị trừng phạt do tội lỗi", "Có ảo giác bị buộc tội hoặc kết tội"] }
        ];

        const ZUNG_QS = [
            { id: 1, text: "Tôi cảm thấy u sầu và buồn bã", reverse: false },
            { id: 2, text: "Buổi sáng là lúc tôi cảm thấy tốt nhất", reverse: true },
            { id: 3, text: "Tôi có những trận khóc hoặc muốn khóc", reverse: false }
        ];
        const ZUNG_OPTS = ["Hiếm khi", "Thỉnh thoảng", "Thường xuyên", "Hầu như luôn luôn"];

        let currentTab = "beck";
        let answers = { beck: {}, hamilton: {}, zung: {} };

        function switchTab(tab) {
            currentTab = tab;
            ["beck", "hamilton", "zung"].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 text-center py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-white text-blue-600 shadow-sm cursor-pointer";
                } else {
                    btn.className = "flex-1 text-center py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider text-slate-600 hover:text-slate-950 cursor-pointer";
                }
            });
            renderQuestions();
        }

        function selectAnswer(qId, val) {
            answers[currentTab][qId] = val;
            renderQuestions();
            calculateScores();
        }

        function calculateScores() {
            // Tính Beck
            let beckTotal = Object.values(answers.beck).reduce((a, b) => a + b, 0);
            document.getElementById("beck-score").innerText = beckTotal + " đ";
            let bEval = document.getElementById("beck-eval");
            if(beckTotal <= 13) { bEval.innerText = "Bình thường"; bEval.className = "text-xs px-2 py-1 rounded-md border font-medium text-green-600 bg-green-50 border-green-200"; }
            else { bEval.innerText = "Có biểu hiện trầm cảm"; bEval.className = "text-xs px-2 py-1 rounded-md border font-medium text-red-600 bg-red-50 border-red-200"; }

            // Tính Hamilton
            let hamTotal = Object.values(answers.hamilton).reduce((a, b) => a + b, 0);
            document.getElementById("ham-score") ? document.getElementById("ham-score").innerText = hamTotal + " đ" : document.getElementById("hamilton-score").innerText = hamTotal + " đ";

            // Tính Zung (Có xử lý logic câu đảo ngược)
            let zungTotal = 0;
            Object.entries(answers.zung).forEach(([qId, val]) => {
                let q = ZUNG_QS.find(x => x.id == qId);
                zungTotal += q.reverse ? (5 - val) : val;
            });
            document.getElementById("zung-score").innerText = zungTotal + " đ";
        }

        function renderQuestions() {
            const wrapper = document.getElementById("questions-wrapper");
            wrapper.innerHTML = "";

            if (currentTab === "beck") {
                BECK_QS.forEach(q => {
                    let html = `<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><p class="font-bold text-slate-900 mb-3 text-sm">${q.id}. ${q.text}</p><div class="grid grid-cols-1 gap-2">`;
                    q.opts.forEach((opt, val) => {
                        let active = answers.beck[q.id] === val ? "bg-blue-50 border-blue-400 text-blue-700 font-semibold" : "bg-slate-50 border-slate-200 text-slate-700";
                        html += `<button onclick="selectAnswer(${q.id}, ${val})" class="w-full text-left px-4 py-3 rounded-lg text-xs sm:text-sm border transition-all flex items-center justify-between ${active}"><span>${opt}</span><span class="font-mono text-xs opacity-60 bg-white px-1.5 py-0.5 rounded border ml-2">${val} đ</span></button>`;
                    });
                    html += `</div></div>`;
                    wrapper.innerHTML += html;
                });
            } else if (currentTab === "hamilton") {
                HAMILTON_QS.forEach(q => {
                    let html = `<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><p class="font-bold text-slate-900 mb-3 text-sm">${q.id}. ${q.text}</p><div class="grid grid-cols-1 gap-2">`;
                    q.opts.forEach((opt, val) => {
                        let active = answers.hamilton[q.id] === val ? "bg-blue-50 border-blue-400 text-blue-700 font-semibold" : "bg-slate-50 border-slate-200 text-slate-700";
                        html += `<button onclick="selectAnswer(${q.id}, ${val})" class="w-full text-left px-4 py-3 rounded-lg text-xs sm:text-sm border transition-all flex items-center justify-between ${active}"><span>${opt}</span><span class="font-mono text-xs opacity-60 bg-white px-1.5 py-0.5 rounded border ml-2">${val} đ</span></button>`;
                    });
                    html += `</div></div>`;
                    wrapper.innerHTML += html;
                });
            } else if (currentTab === "zung") {
                ZUNG_QS.forEach(q => {
                    let html = `<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div class="flex justify-between items-start gap-4 mb-3"><p class="font-bold text-slate-900 text-sm">${q.id}. ${q.text}</p><span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full whitespace-nowrap">${q.reverse ? 'Câu ngược' : 'Câu thuận'}</span></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
                    ZUNG_OPTS.forEach((opt, index) => {
                        let val = index + 1;
                        let active = answers.zung[q.id] === val ? "bg-blue-50 border-blue-400 text-blue-700 font-semibold" : "bg-slate-50 border-slate-200 text-slate-700";
                        let displayScore = q.reverse ? (5 - val) : val;
                        html += `<button onclick="selectAnswer(${q.id}, ${val})" class="w-full text-left px-4 py-3 rounded-lg text-xs sm:text-sm border transition-all flex items-center justify-between ${active}"><span>${opt}</span><span class="font-mono text-xs opacity-60 bg-white px-1.5 py-0.5 rounded border ml-2">${displayScore} đ</span></button>`;
                    });
                    html += `</div></div>`;
                    wrapper.innerHTML += html;
                });
            }
        }

        // Khởi chạy lần đầu
        renderQuestions();
    </script>
</body>
</html>
